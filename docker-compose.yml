version: '3.8'

services:
  # ============================================================================
  # Kafka Ecosystem (Apache Kafka 3.7+ KRaft Mode & Schema Registry)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: streamforge-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-cluster", "cluster-id", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: streamforge-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "bash", "-c" ]
    command: |
      "
      # Wait for broker
      kafka-topics --bootstrap-server kafka:29092 --list
      
      echo 'Creating Kafka topics with 6 partitions for parallel scale...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic streamforge.user.activity --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic streamforge.events.dlq --partitions 3 --replication-factor 1
      
      echo 'Kafka topics configured:'
      kafka-topics --bootstrap-server kafka:29092 --describe --topic streamforge.user.activity
      kafka-topics --bootstrap-server kafka:29092 --describe --topic streamforge.events.dlq
      "

  # ============================================================================
  # MinIO (S3-Compatible High-Performance Object Storage Data Lake)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: streamforge-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init-buckets:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/streamforge-data-lake;
      /usr/bin/mc anonymous set download local/streamforge-data-lake;
      echo 'MinIO buckets initialized:';
      /usr/bin/mc ls local;
      exit 0;
      "

  # ============================================================================
  # PostgreSQL (Relational Serving Layer & Idempotency Store)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: streamforge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: streamforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./schemas/sql/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./schemas/sql/02_idempotency_audit.sql:/docker-entrypoint-initdb.d/02_idempotency_audit.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streamforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Observability (OpenTelemetry Collector, Prometheus, Grafana, Jaeger)
  # ============================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: streamforge-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: streamforge-jaeger
    ports:
      - "16686:16686" # Web UI

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: streamforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.4.2
    container_name: streamforge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards/json

  # ============================================================================
  # StreamForge Application Services
  # ============================================================================
  go-producer:
    build:
      context: ./go-services
      dockerfile: Dockerfile.producer
    container_name: streamforge-go-producer
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_EVENT_TOPIC: "streamforge.user.activity"
      KAFKA_DLQ_TOPIC: "streamforge.events.dlq"
      KAFKA_PRODUCER_BATCH_SIZE: "1000"
      KAFKA_PRODUCER_LINGER_MS: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      ENABLE_LOAD_GENERATOR: "true"
      LOAD_GEN_RATE_PER_SEC: "2000"
      HTTP_PORT: "8080"

  go-parquet-sink:
    build:
      context: ./go-services
      dockerfile: Dockerfile.sink
    container_name: streamforge-go-parquet-sink
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_EVENT_TOPIC: "streamforge.user.activity"
      KAFKA_CONSUMER_GROUP_LAKE: "streamforge-parquet-lake-sink"
      LAKE_BATCH_FLUSH_SIZE: "2000"
      LAKE_FLUSH_INTERVAL_SEC: "5"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_DATA_LAKE_BUCKET: "streamforge-data-lake"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      HTTP_PORT: "8082"

  java-consumer:
    build:
      context: ./java-services
      dockerfile: Dockerfile
    container_name: streamforge-java-consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CONSUMER_GROUP: "streamforge-etl-group"
      KAFKA_EVENT_TOPIC: "streamforge.user.activity"
      KAFKA_DLQ_TOPIC: "streamforge.events.dlq"
      KAFKA_CONCURRENCY: "4"
      KAFKA_MAX_POLL_RECORDS: "1000"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/streamforge"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVER_PORT: "8081"

