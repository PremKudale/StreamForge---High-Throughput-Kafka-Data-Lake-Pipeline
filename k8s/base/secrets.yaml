apiVersion: v1
kind: Secret
metadata:
  name: streamforge-secrets
  namespace: streamforge
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "streamforge_prod_password"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.streamforge.svc.cluster.local:5432/streamforge"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minio_prod_secret_key"
