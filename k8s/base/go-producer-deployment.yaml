apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-go-producer
  namespace: streamforge
  labels:
    app: go-producer
    tier: ingestion
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: go-producer
  template:
    metadata:
      labels:
        app: go-producer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: producer
          image: streamforge/go-producer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: streamforge-config
            - secretRef:
                name: streamforge-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: streamforge-go-producer
  namespace: streamforge
  labels:
    app: go-producer
spec:
  type: ClusterIP
  selector:
    app: go-producer
  ports:
    - name: http
      port: 8080
      targetPort: 8080

