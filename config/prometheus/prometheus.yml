global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'streamforge-go-producer'
    static_configs:
      - targets: ['go-producer:8080']

  - job_name: 'streamforge-java-consumer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['java-consumer:8081']

  - job_name: 'streamforge-parquet-sink'
    static_configs:
      - targets: ['go-parquet-sink:8082']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']

